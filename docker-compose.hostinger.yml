# Production host: Hostinger KVM 2 (2 vCPU / 8 GB RAM / 100 GB NVMe, Ubuntu 24.04, Mumbai, static IPv4).
# Layered on top of the production overlay:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.hostinger.yml ...
#   (deploy/hostinger/deploy.sh and scripts/deploy.sh with COMPOSE_OVERLAYS do this for you)
#
# What it adds - the 8 GB budget (docs/OPERATIONS.md "Resource budget - 8 GB host"):
#   * a memory limit per container, so one runaway process is killed instead of the whole host swapping;
#   * Postgres sized for ~2 GB (shared_buffers 512 MB, work_mem 8 MB, 60 connections). `command` replaces the base
#     file's whole list, so its WAL settings are repeated here - with archiving OFF by default (A1, review R1: nothing
#     pruned the archive and it held raw database pages). PG_ARCHIVE_MODE=on in .env turns point-in-time recovery on;
#     deploy/atp.sh then schedules the encrypted weekly base backup that prunes it (runbook section 6c). The daily
#     encrypted dump stays the recovery point either way;
#   * backup retention (A1): 7 daily dumps, 4 weekly, 6 monthly (BACKUP_RETENTION_DAYS / BACKUP_KEEP_MIN,
#     BACKUP_KEEP_WEEKLY, BACKUP_KEEP_MONTHLY), the same counts on R2 (scripts/backup/offsite_prune.sh), never removing
#     an object inside the bucket lock (OFFSITE_LOCK_DAYS);
#   * Redis capped at 384 MB, evicting only keys that expire (caches, rate windows) - never a key without a TTL;
#   * the Caddyfile chosen by CADDYFILE: `Caddyfile` (a domain, Let's Encrypt) or `Caddyfile.ip` (no domain yet:
#     the server's IP with Caddy's own internal certificate - the browser warns once);
#   * the off-site copy (H-2): Cloudflare R2 by default (`offsite:` remote, OFFSITE_S3_*), Backblaze B2 as the
#     alternative (`b2:` remote, OFFSITE_B2_*), or a local directory (/offsite_local) on a box without a provider.
#
#   * ATP_DEPLOYMENT_PHASE=phase0 for the API and the worker: a Phase 0 install starts PAPER-only (live_trading OFF,
#     phase0_paper_only ON, seeded at first boot) - nothing for the owner to set.
#
# Numbers live here and in .env, not in code (MEM_* / PG_* / REDIS_MAXMEMORY override every limit).
x-limits: &small
  deploy:
    resources:
      limits:
        memory: 256m

services:
  postgres:
    command: ["postgres",
              "-c", "wal_level=replica", "-c", "archive_mode=${PG_ARCHIVE_MODE:-off}", "-c", "archive_timeout=300",
              "-c", "archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f",
              "-c", "shared_buffers=${PG_SHARED_BUFFERS:-512MB}",
              "-c", "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}",
              "-c", "work_mem=${PG_WORK_MEM:-8MB}",
              "-c", "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}",
              "-c", "max_connections=${PG_MAX_CONNECTIONS:-75}",
              "-c", "random_page_cost=1.1",
              "-c", "effective_io_concurrency=200"]
    shm_size: 256m
    # A changed setting above (archive_mode is one) recreates the container on the next deploy: room for a clean
    # shutdown (the image stops Postgres with SIGINT, a fast shutdown) instead of the 10 s default.
    stop_grace_period: ${PG_STOP_GRACE:-60s}
    deploy:
      resources:
        limits:
          memory: ${MEM_POSTGRES:-2g}
    restart: unless-stopped

  redis:
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-384mb}", "--maxmemory-policy", "volatile-lru",
              "--appendonly", "no"]
    deploy:
      resources:
        limits:
          memory: ${MEM_REDIS:-512m}
    restart: unless-stopped

  backend:
    environment:
      # Phase 0 deployment defaults (owner decision 2026-10-12, backend/app/platform/deployment_phase.py): this host starts
      # PAPER-only with nothing for the owner to set - first boot seeds live_trading OFF and phase0_paper_only ON where no
      # entry is stored (never overwriting a later owner change). Leaving Phase 0 is a later owner decision (.env).
      ATP_DEPLOYMENT_PHASE: ${ATP_DEPLOYMENT_PHASE:-phase0}
      # LD-7: one API process per vCPU (KVM 2). bcrypt is shared out between them (app/auth/security.py). Each process
      # keeps 10 connections warm (+5 overflow): with 5 + 5 the overflow connections were closed on every check-in and
      # opened again (TLS attempt, SCRAM auth), 14.5% of the 500-user test's request time spent waiting for one. Under
      # PG_MAX_CONNECTIONS (75): API 2 x (10 + 5) + trading worker 15 + research worker 15 = 60, leaving 12 for backups,
      # restores, migrations and psql beside Postgres' 3 reserved; at about 10 MB a backend, 75 fit the 2 GB limit.
      API_WORKERS: ${API_WORKERS:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
    deploy:
      resources:
        limits:
          memory: ${MEM_BACKEND:-1536m}
    restart: unless-stopped

  worker:
    environment:
      ATP_DEPLOYMENT_PHASE: ${ATP_DEPLOYMENT_PHASE:-phase0}     # the same mode as the API (see backend above)
    deploy:
      replicas: 1          # H-1: exactly one trading worker (ADR-0010); the Redis lock is the backstop, not the plan
      resources:
        limits:
          memory: ${MEM_WORKER:-1536m}
    # Z11: room to finish the cycle and release the Redis replica lock on SIGTERM (a SIGKILL after the default 10 s
    # would leave the lock held until its TTL, and the next worker would wait for it).
    stop_grace_period: ${WORKER_STOP_GRACE:-90s}

  frontend:
    deploy:
      resources:
        limits:
          memory: ${MEM_FRONTEND:-128m}
    restart: unless-stopped

  caddy:
    <<: *small
    volumes: !override
      - ./deploy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    environment:
      # A1 retention (runbook section 11): daily dumps older than BACKUP_RETENTION_DAYS go, never below BACKUP_KEEP_MIN;
      # the first dump of each week / month is also kept in weekly/ and monthly/ (scripts/backup/backup.sh).
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BASE_BACKUP_KEEP: ${BASE_BACKUP_KEEP:-4}
    deploy:
      resources:
        limits:
          memory: ${MEM_BACKUP:-512m}
    volumes:
      - ${OFFSITE_RESTORE_DIR:-/var/backups/atp-restore-test}:/restore:ro    # H-2: the dump fetched back from off-site

  offsite:
    <<: *small
    environment:
      # H-2 (answered 2026-10-10): Cloudflare R2 (S3-compatible; 10 GB and egress free). `offsite:` is the S3 seam -
      # any S3-compatible provider through OFFSITE_S3_PROVIDER / _ENDPOINT; `b2:` is the Backblaze B2 alternative.
      # Credentials live only in this server's .env. /offsite_local remains for a box without a provider yet.
      OFFSITE_REMOTE: ${OFFSITE_REMOTE:-offsite:atp-backups}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_S3_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_S3_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_S3_SECRET_KEY:-}
      RCLONE_CONFIG_OFFSITE_REGION: auto
      RCLONE_CONFIG_OFFSITE_ACL: private
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"     # a bucket-scoped token cannot list or create buckets
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${OFFSITE_B2_KEY_ID:-}
      RCLONE_CONFIG_B2_KEY: ${OFFSITE_B2_APPLICATION_KEY:-}
      # A1: the same counts on R2 (scripts/backup/offsite_prune.sh, run by deploy/atp.sh backup). OFFSITE_LOCK_DAYS
      # must be at least the bucket lock's retention: nothing younger than it + 1 day is ever asked to go.
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_FILES_KEEP: ${BACKUP_FILES_KEEP:-14}
      BASE_BACKUP_KEEP: ${BASE_BACKUP_KEEP:-4}
      OFFSITE_KEEP_PRE_MIGRATION: ${OFFSITE_KEEP_PRE_MIGRATION:-6}
      OFFSITE_LOCK_DAYS: ${OFFSITE_LOCK_DAYS:-14}
    # A1: no wal_archive mount - the WAL archive never leaves the host (scripts/backup/offsite_sync.sh).
    volumes: !override
      - ./scripts/backup:/scripts:ro
      - backups:/backups:ro
      - ${OFFSITE_LOCAL_DIR:-/var/backups/atp-offsite}:/offsite_local
      - ${OFFSITE_RESTORE_DIR:-/var/backups/atp-restore-test}:/restore
