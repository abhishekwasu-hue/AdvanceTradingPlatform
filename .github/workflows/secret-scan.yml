name: Secret scan (full history)

# The repository is public (docs/PUBLIC_REPO_POLICY.md). Two jobs, run on every push to any branch (they take seconds),
# once a week and from the Actions tab; findings are redacted:
#  - `gitleaks-full-history` (blocking): every commit reachable from any branch or tag, with gitleaks (.gitleaks.toml,
#    .gitleaksignore) - not only the commits of a push, which ci.yml's `lint` job scans - and then the checked-out
#    tree itself (`gitleaks dir`).
#  - `gitleaks-pull-request-refs` (report only): the pull request heads (refs/pull/*). Anyone can open a pull request
#    from a fork and its head ref stays forever, so a finding there must not break this workflow for good: it becomes
#    a warning and a job summary (counts and fingerprints only), triaged as the policy's section 6 says.
# A finding is handled as the policy says: rotate the credential first; rewriting history is the owner's decision.
#
# The gitleaks release binary is pinned by version and by the sha256 from that release's official checksums file
# (gitleaks_<version>_checksums.txt); the download is refused when it does not match. No secrets are used. The action
# SHAs are the ones ci.yml pins (the tag each stands for is in the comment).
on:
  push:
    branches: ["**"]
  schedule:
    - cron: "41 3 * * 1"   # Monday 09:11 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"   # gitleaks_8.30.1_linux_x64.tar.gz

jobs:
  gitleaks-full-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # every commit of every branch and tag
          persist-credentials: false  # nothing here writes; the token is not left in .git/config for the tree scan

      - name: Install gitleaks (pinned version, sha256 verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      - name: gitleaks over the full history (all branches and tags, redacted)
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git --log-opts="--all" --config .gitleaks.toml \
            --gitleaks-ignore-path .gitleaksignore --redact --no-banner --verbose --exit-code 1 .

      - name: gitleaks over the checked-out tree (redacted)
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --config .gitleaks.toml \
            --gitleaks-ignore-path .gitleaksignore --redact --no-banner --verbose --exit-code 1

  gitleaks-pull-request-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Anonymous fetch: the repository is public (owner decision PR-1 keeps it public). If it ever becomes private,
      # this step needs the read-only token (persist-credentials: true above).
      - name: Fetch the pull request heads (refs/pull/*)
        run: git fetch --no-tags --quiet origin '+refs/pull/*/head:refs/remotes/pull/*'

      - name: Install gitleaks (pinned version, sha256 verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      # Report only: never fails. Counts and fingerprints (commit:file:rule:line) only - no values.
      - name: gitleaks over the pull request heads (report only, redacted)
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/pull-refs.json"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --log-opts="--remotes=pull" --config .gitleaks.toml \
            --gitleaks-ignore-path .gitleaksignore --redact --no-banner --exit-code 0 \
            --report-format json --report-path "$report" .
          count=$(jq 'length' "$report")
          {
            echo "### gitleaks over pull request heads (report only)"
            echo
            echo "Findings: ${count}. Triage: docs/PUBLIC_REPO_POLICY.md section 6."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "::warning title=gitleaks (pull request heads)::${count} finding(s) - see the job summary; triage per docs/PUBLIC_REPO_POLICY.md section 6"
            # Fingerprints come from other people's commits (file names): every character outside a safe set becomes
            # "?", so nothing can break out of the code block, and at most 50 lines are written.
            {
              echo
              echo '```'
              jq -r '.[:50][] | .Fingerprint | gsub("[^A-Za-z0-9._/:@+-]"; "?")' "$report"
              echo '```'
              if [ "$count" -gt 50 ]; then echo "... and $((count - 50)) more (run gitleaks over refs/pull/* locally to list them)"; fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
