# P1.1: index.html is revalidated on every visit so a deploy's new chunk names are picked up at once; the hashed files
# under /assets/ never change and are cached for a year. API responses keep whatever the backend sets (empty value =
# no header added).
# Keyed on status too: a 404 for a missing chunk must not be cached for a year.
map "$status $uri" $atp_cache_control {
    "~^\d+ /api/"              "";
    "~^(200|304) /assets/"     "public, max-age=31536000, immutable";
    default                    "no-cache";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # P0.3 / S6: a strict Content-Security-Policy. The Vite build loads scripts only from this origin (no inline
    # scripts), styles are this origin's CSS plus inline style attributes (React components set them), and the
    # page may call only this origin. `frame-ancestors 'none'` is the modern X-Frame-Options.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control $atp_cache_control always;

    # The backend container is reachable by its docker-compose service name.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $http_host;  # keeps the port, so URLs the API derives (Upstox OAuth redirect) match the browser
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A chunk an older index.html asks for after a deploy is a clean 404 (not index.html served as JavaScript); the
    # page's error boundary then offers a reload.
    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback so client-side routing (and hard refreshes on any page) still resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
