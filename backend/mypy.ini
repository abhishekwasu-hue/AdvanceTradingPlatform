# P0.7: type-check gate run by the CI `lint` job (`mypy` from backend/, no arguments). Only the
# packages listed in `files` are reported; the rest of `app` is still analysed for the types they
# import (follow_imports = silent) but its own findings are not a gate yet. Add a package here once
# `mypy app/<package>` is clean, in the same PR that makes it so.
[mypy]
python_version = 3.11
files = app/accounts, app/audit, app/contract_notes, app/custom_strategies, app/db, app/exports, app/fx,
        app/incidents, app/indicators, app/kill_switch, app/news_events, app/notifications, app/plans,
        app/portfolio, app/retention, app/screener, app/charts
ignore_missing_imports = True
follow_imports = silent
warn_unused_configs = True
no_implicit_optional = False
