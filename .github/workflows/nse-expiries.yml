name: NSE expiry data

# Rebuilds backend/app/instruments/data/nse_index_expiries.csv from NSE's daily F&O bhavcopies (expiry dates as the
# exchange printed them - no weekday rule). The archive is not reachable from every network, so this runs on a
# GitHub runner. From main the result is committed to `data/nse-expiries`, CI is started on it, then a pull request
# to main is opened (or the open one updated) - never straight to main; the merge is a person's. When the repository
# does not let Actions open pull requests, the run still succeeds (data branch pushed, CI started) and says so in a
# warning and the run summary - open the pull request from `data/nse-expiries` by hand. Run it from the Actions tab (optional start / end dates) or let the weekly schedule refresh it.
# The build refuses (exit 2, nothing committed) on a week with no file, an unexplained NIFTY / BANKNIFTY expiry, any
# 403 from the archive, or a result that knows less than the committed file. Downloaded bhavcopies are kept in the
# Actions cache between runs (a past day's file never changes), so a weekly run reads only the new week.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date to read (YYYY-MM-DD)"
        default: "2016-01-01"
      end:
        description: "Last date to read (YYYY-MM-DD, empty = today)"
        default: ""
  schedule:
    - cron: "17 2 * * 6"   # Saturday 07:47 IST, after the week's last bhavcopy

concurrency:
  group: nse-expiries
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write        # push the data branch
      pull-requests: write   # open the refresh pull request
      actions: write         # start CI on the data branch (pushes made with this token start no workflows)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # the token is handed only to the push and gh steps, not to the NSE download

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Restore the downloaded bhavcopies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/bhav
          key: nse-bhav-${{ github.run_id }}
          restore-keys: nse-bhav-

      - name: Read the bhavcopies and build the expiry file
        env:
          START: ${{ inputs.start || '2016-01-01' }}
          END: ${{ inputs.end }}
        run: |
          python backend/app/instruments/nse_expiries.py --start "$START" ${END:+--end "$END"} \
            --out backend/app/instruments/data --cache "$RUNNER_TEMP/bhav"

      - name: Commit the result for review
        id: commit
        env:
          REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/instruments/data/nse_index_expiries.csv backend/app/instruments/data/nse_index_expiries.meta.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "NSE expiry data: rebuilt from F&O bhavcopies"
          if [ "$REF" = "main" ]; then
            git push --force origin HEAD:refs/heads/data/nse-expiries
            echo "pr=yes" >> "$GITHUB_OUTPUT"
          else
            git push origin HEAD:"refs/heads/$REF"
          fi

      - name: Start CI on the data branch
        if: steps.commit.outputs.pr == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Before the pull request: a pull request opened with this token starts no workflow of its own. A refused
          # dispatch (policy, permissions) never stops the pull request step - it is said instead.
          if ! gh workflow run ci.yml --ref data/nse-expiries; then
            echo "::warning title=CI not started on data/nse-expiries::Start the CI workflow on data/nse-expiries by hand (Actions > CI > Run workflow)."
            { echo "### NSE expiry data: CI not started"; echo; echo "Run CI on data/nse-expiries by hand."; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open the refresh pull request
        if: steps.commit.outputs.pr == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! open_prs=$(gh pr list --head data/nse-expiries --base main --state open --json number --jq length); then
            echo "::warning title=Could not list pull requests::trying to open the refresh pull request anyway"
            open_prs=0
          fi
          if [ "$open_prs" != "0" ]; then
            echo "the open refresh pull request now carries this rebuild"; exit 0
          fi
          meta=backend/app/instruments/data/nse_index_expiries.meta.json
          body="Weekly rebuild of the NSE index expiry file from the F&O bhavcopies (coverage $(python -c "import json;m=json.load(open('$meta'));print(m['coverage_start'],'to',m['coverage_end'],'-',m['rows'],'expiries')")). CI runs on this branch; merge after it is green. Opened by the 'NSE expiry data' workflow."
          if ! gh pr create --base main --head data/nse-expiries --title "NSE expiry data: weekly refresh" --body "$body"; then
            msg="The rebuild is on data/nse-expiries and CI was started on it, but Actions may not open pull requests here. Open one from data/nse-expiries to main by hand, or allow it under Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'."
            echo "::warning title=Refresh pull request not opened::$msg"
            { echo "### NSE expiry data: pull request not opened"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          fi
