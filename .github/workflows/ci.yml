name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:   # the 'NSE expiry data' workflow starts CI on its data branch (its own pushes start none)

# One CI run per commit: a push to an in-repo branch already runs every job on that sha, so the
# pull_request event only has to cover forks (its jobs are skipped otherwise). A newer push to the
# same feature branch cancels the run of the one it replaced.
# A3 (review R3): every main commit gets a result, because `atp.sh deploy` deploys only a commit whose run here
# passed. A group allows one running and ONE pending run, so a shared main group silently cancelled the queued run
# whenever a third push arrived; main pushes therefore get a group of their own sha and run side by side.
# Cost: public repository, so GitHub-hosted runner minutes are free; the limit is the account's concurrent jobs
# (20 on the free plan), so a burst of merges queues instead of being cancelled (docs/deploy/HOSTINGER_RUNBOOK.md 8a).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# P0.7: every third-party action is pinned to a commit SHA (the tag it stands for is in the comment), so a
# re-pointed tag cannot change what runs with this repository's token. Bump by editing the SHA and the comment.
jobs:
  # P0.7: static gates - ruff (backend/ruff.toml), mypy (backend/mypy.ini: the packages that are clean), bandit
  # (medium severity and confidence or worse, app/ only) and a gitleaks secret scan of the commits in the push
  # (.gitleaks.toml). Network: pip and the pinned gitleaks release; runs alongside the test job, not after it.
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans the pushed commits, which needs their parents

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      # The owner's ruling: ATP is English only - UI, AI replies, Telegram / email / push texts, reports, docs. Devanagari
      # only in the strategy interview's explicit allow-list (scripts/check_english_only.py; its test:
      # backend/tests/test_english_only_check.py). Whole repo: backend, frontend, templates, notification texts, docs.
      - name: English only (Devanagari only in the interview allowlist) - whole repo
        run: python scripts/check_english_only.py

      # The repository is public (docs/PUBLIC_REPO_POLICY.md): no server IP, private e-mail address, Telegram token or
      # chat id, private key, secret file type or new golden / parity / real-data fixture in the tree. Its test:
      # backend/tests/test_public_repo_check.py. The full-history gitleaks scan is .github/workflows/secret-scan.yml.
      - name: Public repository guard (scripts/check_public_repo.py) - whole repo
        run: python scripts/check_public_repo.py

      - name: Install linters (pinned) and the application's dependencies (mypy reads them)
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements.lock
          pip install "ruff==0.16.10" "mypy==2.4.0" "bandit==1.9.4" "uv==0.13.6"

      # M55 O3: requirements.lock (hashed, what the image and CI install) must match requirements.txt (the direct
      # dependencies, which Dependabot edits). Re-resolving keeps the current pins, so the lock only changes when
      # requirements.txt does: regenerate it in that PR with `sh scripts/lock_requirements.sh` (from backend/).
      - name: Dependency lock is in step with requirements.txt (backend/scripts/lock_requirements.sh)
        working-directory: backend
        run: |
          sh scripts/lock_requirements.sh --quiet
          git diff --exit-code -- requirements.lock || { echo "::error title=lock::backend/requirements.lock is out of date - run 'sh scripts/lock_requirements.sh' in backend/ and commit it"; exit 1; }

      - name: ruff (backend/ruff.toml)
        working-directory: backend
        run: ruff check app tests evals

      # AUD-G1.6: pyupgrade (UP) is a ratchet, not a gate - its per-rule counts may only fall (baseline in the test).
      - name: ruff UP ratchet (backend/tests/test_ruff_up_ratchet.py)
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider tests/test_ruff_up_ratchet.py

      - name: mypy (backend/mypy.ini - gated packages only)
        working-directory: backend
        run: mypy

      - name: bandit (medium+ severity and confidence, application code)
        working-directory: backend
        run: bandit -q -r app -ll -ii

      - name: shellcheck (Z11 deploy bundle; ShellCheck ships with the runner image)
        run: shellcheck -x deploy/atp.sh deploy/hostinger/install.sh deploy/ci/*.sh backend/scripts/serve_api.sh

      - name: Migration rollback safety (every migration declares ROLLBACK_SAFE; risky upgrades are not marked safe)
        run: python backend/scripts/migration_rollback_safety.py lint

      # Only the commits of this push; secret-scan.yml scans the full history (push to main, weekly, on demand).
      - name: gitleaks secret scan (.gitleaks.toml)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"           # the binary the action downloads; pinned like everything else
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"    # the job has no write permission; the failing step is the signal

  backend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90          # the full suite reached ~54 min on 2026-10-23 (runs cancelled at the old 55-min cap; 30 min before that)
    services:
      postgres:
        image: postgres:17-alpine  # the production major; the runner's pg_dump (17+) writes SET transaction_timeout, which 16 rejects
        env:
          POSTGRES_USER: atp_user
          POSTGRES_PASSWORD: atp_dev_password
          POSTGRES_DB: advance_trading_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atp_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Run test suite (in-memory SQLite, no DB dependency)
        env:
          REDIS_URL: redis://localhost:6379/0
          # Z5 P1-d: the entry-slot race test also runs on Postgres (in its own scratch database, created and dropped by
          # the test, so the migration steps below still start from an empty schema).
          Z5_TEST_PG_URL: postgresql+asyncpg://atp_user:atp_dev_password@localhost:5432/advance_trading_platform
        # P0.7: each failed test becomes a check-run annotation (`::error`), so the failure is readable from the API
        # without the job log (which GitHub serves from a host the session tooling cannot reach).
        # The default shell is `bash -e`: a failing pipeline would stop the script before the annotations are written,
        # so the exit status is captured with `|| status=$?` instead of relying on $? after the pipe.
        run: |
          set -o pipefail
          status=0
          python -m pytest -q -rfEs --durations=25 -m "not lookahead" 2>&1 | tee pytest-output.txt || status=$?
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | head -50 | sed 's/^/::error title=pytest::/' || true
          exit $status

      - name: Apply Alembic migrations against a real Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://atp_user:atp_dev_password@localhost:5432/advance_trading_platform
        run: alembic upgrade head

      - name: Confirm no schema drift between models and migrations
        env:
          DATABASE_URL: postgresql+asyncpg://atp_user:atp_dev_password@localhost:5432/advance_trading_platform
        run: alembic check

      - name: Backup rehearsal (pg_dump -> restore into scratch DB -> verify, Phase E3)
        env:
          DATABASE_URL: postgresql+asyncpg://atp_user:atp_dev_password@localhost:5432/advance_trading_platform
        run: python -m pytest tests/test_backup_scripts.py -q -rs

      # Z11: the backup scripts run in the backup service's own image on the server (busybox sh, Alpine openssl), not on
      # this runner - so run them there too: build deploy/backup.Dockerfile on the Postgres major of this job's service
      # database, take an encrypted + sealed dump, and restore-verify it into a scratch database as the restore role.
      - name: Backup scripts inside the backup image (Alpine, busybox sh)
        working-directory: .
        run: |
          docker build -q -f deploy/backup.Dockerfile --build-arg PG_IMAGE=postgres:17-alpine -t atp-backup:ci .
          docker run --rm --network host -v "$PWD/scripts/backup:/scripts:ro" \
            -e DATABASE_URL=postgresql://atp_user:atp_dev_password@localhost:5432/advance_trading_platform \
            -e BACKUP_DIR=/tmp/backups -e BACKUP_ENCRYPTION_PASSPHRASE=FAKEFAKE-ci-backup-passphrase \
            --entrypoint sh atp-backup:ci -c 'sh /scripts/backup.sh && ls /tmp/backups/*.dump.enc.hmac && sh /scripts/verify_backup.sh latest > /tmp/report.json; cat /tmp/report.json; grep -q "\"status\":\"ok\"" /tmp/report.json'

      - name: Audit Python dependencies for known vulnerabilities (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --disable-pip -r requirements.lock

  # Z10-a (U3 G2): the no-look-ahead harness over every shipped bar function, in parallel with the main backend run.
  backend-lookahead:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: No-look-ahead harness (tests marked lookahead)
        run: |
          set -o pipefail
          status=0
          python -m pytest -q -rfEs -m lookahead tests/test_z10a_no_lookahead.py tests/test_n1_l2_daily_trend.py 2>&1 | tee pytest-output.txt || status=$?
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | head -50 | sed 's/^/::error title=lookahead::/' || true
          exit $status

  # Z10-d (G4 + load, docs/PERFORMANCE.md): the screener's performance targets (ATP_SCREENER_SPEC §1.5) on a synthetic
  # universe - each the median of 5 timed runs after a warm-up, the budget scaled by the printed CI factor - and the
  # session-shaped load test with 20 users against the in-process test app (a temporary SQLite file, never a deployed host).
  # Numbers are written as check-run notices. Runs alongside the other jobs (about 1.5 minutes, most of it pip and the load test).
  perf:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: G4 screener targets (EOD 2,500 x 50 < 3 s, cached < 0.2 s, bar-close 200 symbols < 1 s; x CI factor)
        env:
          ATP_PERF: "1"
        run: python -m pytest tests/test_z10d_perf.py -q -rA -s -p no:cacheprovider

      - name: N4 CH6 chart studies (50,000 bars x 6 ScreenQL studies + JSON < 1 s; x CI factor)
        env:
          ATP_PERF: "1"
        run: python -m pytest tests/test_ch6_chart_studies.py -k perf_job -q -rA -s -p no:cacheprovider

      - name: Load test, 20 session-shaped users against the in-process test app (scripts/loadtest.py; SLO per scenario)
        run: python scripts/loadtest.py --in-process --users 20 --seconds 20 --ramp 10 --think 1 --slo-factor auto --annotate

  frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60  # build + unit + e2e: Playwright alone took 37 min on 26 Oct (#558 cancelled at the old 40-min cap with every step green); 25 min before that (#438, #450)
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The English-only check covers the whole repository now: the lint job's "English only" step.

      # AUD-G1.6: ESLint + typescript-eslint (eslint.config.js). Errors fail; the warnings the code had when ESLint was
      # added are a per-rule ratchet whose counts may only fall (scripts/check-eslint-ratchet.mjs).
      - name: ESLint (typescript-eslint + React hooks; warnings ratcheted)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      # UI2-0: v2 screens (*V2*.tsx, src/ui/*.tsx) use semantic colour tokens only - no raw palette hues.
      - name: UI v2 colour lint (no raw palette hues in v2 files)
        run: npm run check:v2-colours

      # Mobile B1: API URLs only through src/api/base.ts, no IP address in src/ or android/, the Android build rules
      # (scripts/mobile-rules.mjs) and one package id. The APK itself is built by .github/workflows/android.yml.
      - name: Mobile config lint (API base, no IP addresses, Android build rules)
        run: npm run check:mobile

      - name: Type-check + production build
        run: npm run build

      - name: JS budgets (initial 300 KB; Copilot route 120 KB; Copilot 3D chunk 180 KB - gzip)
        run: npm run check:bundle

      - name: Browser tests (Playwright, Copilot - mocked API, desktop + mobile)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Generated palette is up to date (scripts/gen-palette.mjs)
        run: npm run gen:palette && git diff --exit-code -- src/styles/palette.css

      - name: Design-system catalogue builds (Storybook)
        run: npm run build-storybook

      - name: Audit production dependencies for known vulnerabilities (npm audit)
        run: npm audit --omit=dev

      - name: Audit all dependencies including dev-only (report only, does not fail the build)
        if: always()
        run: npm audit || true

  container-scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A4: no `needs` - the scan runs even while a test job is red (it used to be skipped then, review A4 notes), so a
    # vulnerable image is reported on every push whatever the tests say.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend image
        run: docker build -t atp-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t atp-frontend:ci ./frontend

      - name: Scan backend image for OS/dependency vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atp-backend:ci
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan frontend image for OS/dependency vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atp-frontend:ci
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      # A4 (review A4 notes): the images the server also runs but this repository does not build from its own code - the
      # backup image (postgres:17-alpine + openssl, the production major) and the pinned third-party services. REPORT ONLY
      # for now (RDY-31): a HIGH inside an upstream image is fixed by the upstream rebuild, not by a change here, so it must
      # not turn every push red. The findings are in the job log; the owner may make them blocking after a clean month.
      - name: Build backup image (production Postgres major)
        if: always()
        run: docker build -q -f deploy/backup.Dockerfile --build-arg PG_IMAGE=postgres:17-alpine -t atp-backup:ci .

      - name: Scan backup image (Trivy, report only)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atp-backup:ci
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true

      - name: Scan pinned third-party images (Trivy, report only)
        if: always()
        run: |
          # The same list `atp.sh` pulls (deploy/atp.sh); the Trivy binary the action above installed is on PATH.
          for img in redis:7-alpine caddy:2-alpine rclone/rclone:1; do
            echo "::group::$img"
            trivy image --quiet --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 "$img" || echo "could not scan $img"
            echo "::endgroup::"
          done
