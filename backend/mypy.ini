# P0.7: type-check gate run by the CI `lint` job (`mypy` from backend/, no arguments). Only the
# packages listed in `files` are reported; the rest of `app` is still analysed for the types they
# import (follow_imports = silent) but its own findings are not a gate yet. Add a package here once
# `mypy app/<package>` is clean, in the same PR that makes it so.
# AUD-G1.6 plan toward all of app: 3 packages added (compliance, options_builder, setup_recall - clean as they were).
# Step 2: 13 more (live, market_store, mobile, performance, scanner clean; alerts, me, signal_scoring, today,
# support_resistance, universe, quant, observability with their findings fixed, type-only).
# Next: admin 2, cache 3, marketplace 3, platform 3, core 5, deployments 5 (route return types / Tenant-None / redis
# stubs need a decision, not a cast); the large ones (ai 97, backtest 49, execution 43, workers 32) one package at a time.
