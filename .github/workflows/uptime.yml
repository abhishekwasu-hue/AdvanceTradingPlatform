name: Uptime (outside check)

# Production readiness A2, changed by the owner's RDY-21 decision. An outside check of the live site from a GitHub
# runner - not from the Hostinger host, so it still speaks when the host cannot. Every 10 minutes it asks
# https://aialgodesk.tech/ and /api/system/health (scripts/monitoring/uptime_check.py, standard library only).
#
# This repository is PUBLIC: an outage is never written to a GitHub issue or comment. The only alert is a private
# Telegram message to the owner through the repository secrets UPTIME_TELEGRAM_BOT_TOKEN and UPTIME_TELEGRAM_CHAT_ID
# (Settings > Secrets and variables > Actions; names only, no value in git): one "DOWN" message after two failed
# rounds in a row (90 s apart) and one "back up" message on recovery. What was sent is kept in a small state file
# carried between runs in the Actions cache (saved only when it changes). Without the secrets the run logs a plain
# notice and stays green. A repository variable UPTIME_BASE_URL can point the check elsewhere (a staging host).
#
# The free outside uptime service (runbook section 10b) is the PRIMARY monitor; this cron is the free second opinion.
# GitHub may start a scheduled run late or skip one under load, and it disables scheduled workflows in a public
# repository after 60 days without repository activity (re-enable: Actions tab > this workflow > Enable workflow).
on:
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'abhishekwasu-hue/AdvanceTradingPlatform'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      UPTIME_STATE_FILE: .uptime-state/state.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/monitoring
          persist-credentials: false
      - name: Remember what the last run sent
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: uptime-state-
      - name: Check the site and the API from outside
        id: check
        env:
          UPTIME_BASE_URL: ${{ vars.UPTIME_BASE_URL }}
          UPTIME_TELEGRAM_BOT_TOKEN: ${{ secrets.UPTIME_TELEGRAM_BOT_TOKEN }}
          UPTIME_TELEGRAM_CHAT_ID: ${{ secrets.UPTIME_TELEGRAM_CHAT_ID }}
        run: python3 scripts/monitoring/uptime_check.py
      - name: Keep the new state for the next run
        if: steps.check.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}-${{ github.run_attempt }}
