name: NSE expiry data

# Rebuilds backend/app/instruments/data/nse_index_expiries.csv from NSE's daily F&O bhavcopies (expiry dates as the
# exchange printed them - no weekday rule). The archive is not reachable from every network, so this runs on a
# GitHub runner. From main the result is committed to `data/nse-expiries`, CI is started on it and a pull request
# to main is opened (or the open one updated) - never straight to main; the merge is a person's. Run it from the Actions tab (optional start / end dates) or let the weekly schedule refresh it.
# The build refuses (exit 2, nothing committed) on a week with no file, an unexplained NIFTY / BANKNIFTY expiry, or a
# result that knows less than the committed file.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date to read (YYYY-MM-DD)"
        default: "2016-01-01"
      end:
        description: "Last date to read (YYYY-MM-DD, empty = today)"
        default: ""
  schedule:
    - cron: "17 2 * * 6"   # Saturday 07:47 IST, after the week's last bhavcopy

concurrency:
  group: nse-expiries
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write        # push the data branch
      pull-requests: write   # open the refresh pull request
      actions: write         # start CI on the data branch (pushes made with this token start no workflows)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # the token is handed only to the push and gh steps, not to the NSE download

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Read the bhavcopies and build the expiry file
        env:
          START: ${{ inputs.start || '2016-01-01' }}
          END: ${{ inputs.end }}
        run: |
          python backend/app/instruments/nse_expiries.py --start "$START" ${END:+--end "$END"} \
            --out backend/app/instruments/data --cache "$RUNNER_TEMP/bhav"

      - name: Commit the result for review
        id: commit
        env:
          REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/instruments/data/nse_index_expiries.csv backend/app/instruments/data/nse_index_expiries.meta.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "NSE expiry data: rebuilt from F&O bhavcopies"
          if [ "$REF" = "main" ]; then
            git push --force origin HEAD:refs/heads/data/nse-expiries
            echo "pr=yes" >> "$GITHUB_OUTPUT"
          else
            git push origin HEAD:"refs/heads/$REF"
          fi

      - name: Start CI and open the refresh pull request
        if: steps.commit.outputs.pr == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh pr list --head data/nse-expiries --base main --state open --json number --jq length)" = "0" ]; then
            meta=backend/app/instruments/data/nse_index_expiries.meta.json
            body="Weekly rebuild of the NSE index expiry file from the F&O bhavcopies (coverage $(python -c "import json;m=json.load(open('$meta'));print(m['coverage_start'],'to',m['coverage_end'],'-',m['rows'],'expiries')")). CI runs on this branch; merge after it is green. Opened by the 'NSE expiry data' workflow."
            gh pr create --base main --head data/nse-expiries --title "NSE expiry data: weekly refresh" --body "$body" || {
              echo "::error::Could not open the pull request. Allow it under Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests', or open one from data/nse-expiries by hand."
              exit 1; }
          else
            echo "the open refresh pull request now carries this rebuild"
          fi
          gh workflow run ci.yml --ref data/nse-expiries
