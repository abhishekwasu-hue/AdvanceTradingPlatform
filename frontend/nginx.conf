server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # P0.3 / S6: a strict Content-Security-Policy. The Vite build loads scripts only from this origin (no inline
    # scripts), styles are this origin's CSS plus inline style attributes (React components set them), and the
    # page may call only this origin. `frame-ancestors 'none'` is the modern X-Frame-Options.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The backend container is reachable by its docker-compose service name.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $http_host;  # keeps the port, so URLs the API derives (Upstox OAuth redirect) match the browser
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so client-side routing (and hard refreshes on any page) still resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
