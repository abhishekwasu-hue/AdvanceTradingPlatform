<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRV2 P3 agent mode</title>
<style>body{font-family:system-ui,sans-serif;margin:16px;background:#f6f7f9;color:#111}h1{font-size:20px}h2{font-size:16px;margin-top:24px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}figure{margin:0;background:#fff;border:1px solid #ddd;padding:8px;max-width:100%}
img{max-width:100%;height:auto;display:block}figcaption{font-size:13px;color:#555;margin-top:6px}</style></head><body>
<h1>SRV2 P3: the owner's trading agent mode (Admin → Controls → Safety)</h1>
<p>Before: no way to pick the mode in ATP. After: one card, only for the owner account. "Automatic" asks for one confirm; every switch is audited.</p>
<h2>Before (phone, light)</h2>
<div class="row"><figure><img src="before-controls-390-light.png" alt="Controls before"><figcaption>Controls → Safety: no agent card</figcaption></figure></div>
<h2>After</h2>
<div class="row">
<figure><img src="agent-mode-ask-v2-390-light.png" alt="Ask me first, phone"><figcaption>Phone: Ask me first (default)</figcaption></figure>
<figure><img src="agent-mode-auto-v2-390-light.png" alt="Automatic, phone"><figcaption>Phone: after the confirm, Automatic + Vision switch + recent cards + last change</figcaption></figure>
<figure><img src="agent-mode-ask-v2-1440-dark.png" alt="Ask me first, desktop dark"><figcaption>Desktop dark: Ask me first</figcaption></figure>
<figure><img src="agent-mode-auto-v2-1440-dark.png" alt="Automatic, desktop dark"><figcaption>Desktop dark: Automatic</figcaption></figure>
</div></body></html>
