# Local guards before a commit is made (docs/PUBLIC_REPO_POLICY.md). The repository is public: everything committed is
# public. Install once with `pip install pre-commit && pre-commit install`. CI runs the same checks (ci.yml `lint`
# job: gitleaks over the pushed commits and scripts/check_public_repo.py; secret-scan.yml: gitleaks over the full
# history), so the hooks only catch a mistake earlier - they are not the only line.
repos:
  # gitleaks over the staged changes, with .gitleaks.toml / .gitleaksignore; findings are redacted.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1 (the version ci.yml and secret-scan.yml pin)
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Server IPs, private e-mail addresses, Telegram tokens / chat ids, private keys, secret file types and new
      # golden / parity / real-data fixtures (the whole tree; about 3 s).
      - id: check-public-repo
        name: public repository guard (scripts/check_public_repo.py)
        entry: python3 scripts/check_public_repo.py
        language: system
        pass_filenames: false
        always_run: true
