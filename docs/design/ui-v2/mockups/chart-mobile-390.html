<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Chart · mobile</title>
<style>
:root {
  color-scheme: light;
  /* Existing P1.2 / U5 tokens (frontend/src/styles/tokens.css, light theme) - unchanged values */
  --surface: 244 246 249; --surface-1: 255 255 255; --surface-2: 238 241 246; --surface-3: 226 231 239;
  --border: 211 217 227; --fg: 15 23 42; --fg-muted: 71 85 105;
  --brand: 37 99 235; --brand-strong: 29 78 216; --on-brand: 255 255 255; --brand-fill: 37 99 235;
  --up: 21 128 61; --down: 185 28 28; --warn: 180 83 9;
  --chart-grid: 229 233 240; --chart-text: 71 85 105;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 0 0 1px rgba(15, 23, 42, 0.03);
  --radius-control: 6px; --radius-panel: 10px;
  /* Proposed v2 additions */
  --border-subtle: 229 233 240;
  --warn-tint: 255 251 235;
  --shadow-raised: 0 8px 24px rgba(15, 23, 42, 0.12), 0 0 0 1px rgba(15, 23, 42, 0.04);
  --radius-pill: 999px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px;
  --dur-fast: 120ms; --dur-base: 200ms; --ease: cubic-bezier(0.2, 0, 0, 1);
  --tap: 44px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: rgb(var(--surface)); }
body { font: 400 14px/20px "Inter", -apple-system, "Segoe UI", Roboto, sans-serif; color: rgb(var(--fg));
  -webkit-font-smoothing: antialiased; font-feature-settings: "cv11" 1; }
a { color: inherit; text-decoration: none; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.s16 { width: 16px; height: 16px; } svg.i.s14 { width: 14px; height: 14px; } svg.i.s20 { width: 20px; height: 20px; } svg.i.s22 { width: 22px; height: 22px; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "cv11" 1; }
.up { color: rgb(var(--up)); } .down { color: rgb(var(--down)); } .muted { color: rgb(var(--fg-muted)); } .brand { color: rgb(var(--brand)); } .warn { color: rgb(var(--warn)); }
.t-page { font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -0.01em; }
.t-sec { font-size: 15px; line-height: 20px; font-weight: 600; }
.t-body { font-size: 14px; line-height: 20px; }
.t-cap { font-size: 12px; line-height: 16px; font-weight: 500; color: rgb(var(--fg-muted)); }
.t-fig { font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -0.01em; }
.t-fig-s { font-size: 15px; line-height: 20px; font-weight: 600; }
.w5 { font-weight: 500; } .w6 { font-weight: 600; }
.row-flex { display: flex; align-items: center; gap: var(--space-2); }
.grow { flex: 1; min-width: 0; } .right { margin-left: auto; } .tr { text-align: right; }
.trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* App shell */
.app { display: flex; min-height: 100vh; }
.side { width: 240px; flex: none; background: rgb(var(--surface-1)); border-right: 1px solid rgb(var(--border-subtle)); display: flex; flex-direction: column; }
.logo { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-weight: 600; font-size: 15px; }
.mark { width: 28px; height: 28px; border-radius: 8px; background: rgb(var(--fg)); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; letter-spacing: 0.02em; }
.nav { padding: 4px 8px 12px; flex: 1; }
.sec-h { display: flex; align-items: center; height: 32px; padding: 0 10px; margin-top: 8px; font-size: 12px; font-weight: 600; color: rgb(var(--fg-muted)); border-radius: 6px; }
.sec-h svg { margin-left: auto; }
.item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 6px; color: rgb(var(--fg-muted)); font-weight: 500; }
.item.on { background: rgb(var(--brand) / 0.08); color: rgb(var(--fg)); font-weight: 600; }
.item.on svg { color: rgb(var(--brand)); }
.count { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: rgb(var(--surface-2)); color: rgb(var(--fg)); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
.side-foot { border-top: 1px solid rgb(var(--border-subtle)); padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: rgb(var(--surface-2)); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 32px; border-bottom: 1px solid rgb(var(--border-subtle)); background: rgb(var(--surface-1)); }
.search { flex: 0 1 460px; height: 36px; border: 1px solid rgb(var(--border)); border-radius: 6px; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: rgb(var(--fg-muted)); background: rgb(var(--surface)); }
.kbd { margin-left: auto; font-size: 11px; line-height: 18px; border: 1px solid rgb(var(--border)); border-radius: 4px; padding: 0 6px; background: rgb(var(--surface-1)); }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 6px; color: rgb(var(--fg-muted)); position: relative; }
.pip { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--brand)); border: 2px solid rgb(var(--surface-1)); }
.content { padding: 24px 32px 56px; max-width: 1240px; width: 100%; }
.page-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 20px; }

/* Cards: one style, never nested */
.card { background: rgb(var(--surface-1)); border: 1px solid rgb(var(--border-subtle)); border-radius: var(--radius-panel); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 8px; padding: 16px 20px 8px; }
.card-b { padding: 4px 20px 16px; }
.link { color: rgb(var(--brand)); font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 2px; }
.list-row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 0; border-top: 1px solid rgb(var(--border-subtle)); }
.list-row:first-child { border-top: 0; }
.stack > * + * { margin-top: 16px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: rgb(var(--border-subtle)); border-radius: 8px; overflow: hidden; border: 1px solid rgb(var(--border-subtle)); }
.tile { background: rgb(var(--surface-1)); padding: 12px 14px; }

/* Controls */
.btn { height: 36px; padding: 0 14px; border-radius: var(--radius-control); border: 1px solid rgb(var(--border)); background: rgb(var(--surface-1)); font: 600 14px/20px "Inter", sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: rgb(var(--fg)); white-space: nowrap; }
.btn-p { background: rgb(var(--brand-fill)); border-color: rgb(var(--brand-fill)); color: rgb(var(--on-brand)); }
.btn-g { border-color: transparent; background: transparent; color: rgb(var(--brand)); padding: 0 8px; }
.btn-l { height: 44px; padding: 0 18px; font-size: 15px; }
.btn-block { width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--radius-pill); background: rgb(var(--surface-2)); font-size: 12px; font-weight: 500; color: rgb(var(--fg)); white-space: nowrap; }
.chip.warn { background: rgb(var(--warn) / 0.1); color: rgb(var(--warn)); }
.chip.out { background: transparent; border: 1px solid rgb(var(--border)); color: rgb(var(--fg-muted)); }
.chip.live { background: rgb(var(--fg)); color: #fff; font-weight: 600; }
.chip.sel { background: rgb(var(--brand) / 0.08); color: rgb(var(--brand)); font-weight: 600; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.seg { display: inline-flex; background: rgb(var(--surface-2)); border-radius: 8px; padding: 3px; gap: 2px; }
.seg span { height: 30px; padding: 0 12px; border-radius: 6px; display: inline-flex; align-items: center; font-size: 13px; font-weight: 500; color: rgb(var(--fg-muted)); }
.seg span.on { background: rgb(var(--surface-1)); color: rgb(var(--fg)); font-weight: 600; box-shadow: var(--shadow); }
.tabs { display: flex; gap: 24px; border-bottom: 1px solid rgb(var(--border-subtle)); }
.tabs span { padding: 10px 0; font-weight: 500; color: rgb(var(--fg-muted)); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
.tabs span.on { color: rgb(var(--fg)); font-weight: 600; border-color: rgb(var(--brand)); }
.field { display: block; }
.field + .field { margin-top: 18px; }
.label { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.input { height: 40px; border: 1px solid rgb(var(--border)); border-radius: var(--radius-control); background: rgb(var(--surface-1)); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 14px; }
.input.ro { background: rgb(var(--surface-2)); border-color: rgb(var(--surface-2)); }
.input.ok { border-color: rgb(var(--border)); }
.input.err { border-color: rgb(var(--warn)); box-shadow: 0 0 0 3px rgb(var(--warn) / 0.12); }
.input.focus { border-color: rgb(var(--brand)); box-shadow: 0 0 0 3px rgb(var(--brand) / 0.15); }
.input .ph { color: rgb(var(--fg-muted) / 0.75); }
.hint { margin-top: 6px; font-size: 12px; line-height: 16px; color: rgb(var(--fg-muted)); }
.hint.err { color: rgb(var(--warn)); font-weight: 500; }
.q { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid rgb(var(--fg-muted)); color: rgb(var(--fg-muted)); font-size: 10px; font-weight: 700; display: inline-grid; place-items: center; }
.mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 13px; }
.note { display: flex; gap: 10px; padding: 12px 14px; border-radius: 8px; background: rgb(var(--surface-2)); font-size: 13px; line-height: 18px; }
.note.warn { background: rgb(var(--warn-tint)); color: rgb(var(--fg)); }
.divider { height: 1px; background: rgb(var(--border-subtle)); margin: 16px 0; }
.ribbon { height: 22px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; background: rgb(var(--fg)); color: #fff; letter-spacing: 0.02em; }

/* Mobile */
.m-top { position: sticky; top: 0; z-index: 5; height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px; background: rgb(var(--surface-1)); border-bottom: 1px solid rgb(var(--border-subtle)); }
.m-content { padding: 16px 16px 96px; }
.bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; height: 64px; display: flex; background: rgb(var(--surface-1)); border-top: 1px solid rgb(var(--border-subtle)); }
.bnav a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: rgb(var(--fg-muted)); position: relative; }
.bnav a.on { color: rgb(var(--brand)); font-weight: 600; }
.bnav .bdg { position: absolute; top: 7px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: rgb(var(--fg)); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }

.tb { display: flex; align-items: center; gap: 8px; }
.picker { height: 36px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid rgb(var(--border)); border-radius: 6px; background: rgb(var(--surface-1)); font-weight: 600; }
.menu { position: absolute; width: 300px; background: rgb(var(--surface-1)); border-radius: 10px; box-shadow: var(--shadow-raised); padding: 8px; z-index: 6; }
.menu .mi { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 6px; font-size: 14px; }
.menu .mi.on { background: rgb(var(--surface-2)); }
.box { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid rgb(var(--border)); display: grid; place-items: center; flex: none; }
.box.on { background: rgb(var(--brand-fill)); border-color: rgb(var(--brand-fill)); color: #fff; }
.watch-row { display: flex; align-items: center; height: 44px; padding: 0 16px; border-top: 1px solid rgb(var(--border-subtle)); }
.watch-row.on { background: rgb(var(--brand) / 0.06); }
table.sig { width: 100%; border-collapse: collapse; }
table.sig th { text-align: left; font-size: 12px; font-weight: 500; color: rgb(var(--fg-muted)); padding: 10px 10px; border-bottom: 1px solid rgb(var(--border-subtle)); white-space: nowrap; }
table.sig td { padding: 12px 10px; font-size: 13px; border-bottom: 1px solid rgb(var(--border-subtle)); vertical-align: middle; font-size: 14px; }
table.sig tr.on td { background: rgb(var(--brand) / 0.05); }
table.sig tr.on td:first-child { box-shadow: inset 3px 0 0 rgb(var(--brand)); }
.kv { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: rgb(var(--border-subtle)); border-radius: 8px; overflow: hidden; border: 1px solid rgb(var(--border-subtle)); }
.kv > div { background: rgb(var(--surface-1)); padding: 10px 12px; }
.checkline { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 18px; padding: 4px 0; }
