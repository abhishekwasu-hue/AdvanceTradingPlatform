# Phase P5: deploy main to the staging host over SSH. Runs only when the repository has the
# STAGING_SSH_HOST / STAGING_SSH_USER / STAGING_SSH_KEY secrets; without them the job is skipped,
# so forks and local clones are unaffected. The host needs docker compose and a checkout of this
# repository at STAGING_REPO_PATH (default /opt/atp).
name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (default: main)"
        required: false
        default: main
  push:
    branches: ["main"]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.STAGING_ENABLED == 'true' }}
    steps:
      # P0.1: workflow inputs and variables reach the shell as environment variables, never interpolated
      # into the script text (a ref such as `x"; rm -rf /` would otherwise run on the staging host).
      - name: Deploy over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0 (P0.7: SHA-pinned)
        env:
          DEPLOY_REF: ${{ github.event.inputs.ref }}
          REPO_PATH: ${{ vars.STAGING_REPO_PATH }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: DEPLOY_REF,REPO_PATH
          script: |
            set -e
            cd "${REPO_PATH:-/opt/atp}"
            git fetch -q origin
            case "${DEPLOY_REF:-origin/main}" in -*|*[!A-Za-z0-9._/@^~+-]*) echo "refusing ref with unexpected characters" >&2; exit 1;; esac
            scripts/deploy.sh staging "${DEPLOY_REF:-origin/main}"
      - name: Smoke test
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          curl -sf "${STAGING_URL:-http://localhost:18000}/api/system/health" || echo "smoke test skipped (STAGING_URL unset or unreachable from runner)"
