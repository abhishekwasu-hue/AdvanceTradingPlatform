<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090c12" />
    <title>Offline - AiAlgoDesk</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- PW1: shown by the service worker when a page is opened without a connection. No scripts (the CSP allows only
         same-origin script files) and no market data: prices, positions and alerts are never stored on the device. -->
    <style>
      :root { color-scheme: dark light; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
             padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
             box-sizing: border-box; background: #090c12; color: #f1f5f9; font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
      @media (prefers-color-scheme: light) { body { background: #f4f6f9; color: #0f172a; } p { color: #475569 !important; } }
      main { max-width: 420px; text-align: center; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #c2cad8; margin: 0 0 20px; }
      a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 20px; border-radius: 8px; background: #2563eb; color: #fff;
          text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>AiAlgoDesk needs a connection to show prices, positions and alerts. Nothing market-related is stored on this device, so nothing shown here can be out of date.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
