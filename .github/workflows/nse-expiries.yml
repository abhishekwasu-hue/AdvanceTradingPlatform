name: NSE expiry data

# Rebuilds backend/app/instruments/data/nse_index_expiries.csv from NSE's daily F&O bhavcopies (expiry dates as the
# exchange printed them - no weekday rule). The archive is not reachable from every network, so this runs on a
# GitHub runner. The result is committed to `data/nse-expiries` (from main) for review as a pull request - never
# straight to main. Run it from the Actions tab (optional start / end dates) or let the weekly schedule refresh it.
# The build refuses (exit 2, nothing committed) on a week with no file, an unexplained BANKNIFTY expiry, or a result
# that knows less than the committed file.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date to read (YYYY-MM-DD)"
        default: "2016-01-01"
      end:
        description: "Last date to read (YYYY-MM-DD, empty = today)"
        default: ""
  schedule:
    - cron: "17 2 * * 6"   # Saturday 07:47 IST, after the week's last bhavcopy
  push:   # TEMPORARY: rebuild on the pull request branch; removed before merge
    branches: ["claude/banknifty-expiries"]
    paths: ["backend/app/instruments/nse_expiries.py", ".github/workflows/nse-expiries.yml"]

concurrency:
  group: nse-expiries
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Read the bhavcopies and build the expiry file
        env:
          START: ${{ inputs.start || '2016-01-01' }}
          END: ${{ inputs.end }}
        run: |
          python backend/app/instruments/nse_expiries.py --start "$START" ${END:+--end "$END"} \
            --out backend/app/instruments/data --cache "$RUNNER_TEMP/bhav"

      - name: Commit the result for review
        env:
          REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/instruments/data/nse_index_expiries.csv backend/app/instruments/data/nse_index_expiries.meta.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "NSE expiry data: rebuilt from F&O bhavcopies"
          if [ "$REF" = "main" ]; then
            git push --force origin HEAD:refs/heads/data/nse-expiries
            echo "pushed to data/nse-expiries - open a pull request to main"
          else
            git push origin HEAD:"refs/heads/$REF"
          fi
