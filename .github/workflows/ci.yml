name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

# One CI run per commit: a push to an in-repo branch already runs every job on that sha, so the
# pull_request event only has to cover forks (its jobs are skipped otherwise). A newer push to the
# same feature branch cancels the run of the one it replaced; main is never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# P0.7: every third-party action is pinned to a commit SHA (the tag it stands for is in the comment), so a
# re-pointed tag cannot change what runs with this repository's token. Bump by editing the SHA and the comment.
jobs:
  # P0.7: static gates - ruff (backend/ruff.toml), mypy (backend/mypy.ini: the packages that are clean), bandit
  # (medium severity and confidence or worse, app/ only) and a gitleaks secret scan of the commits in the push
  # (.gitleaks.toml). Network: pip and the pinned gitleaks release; runs alongside the test job, not after it.
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # gitleaks scans the pushed commits, which needs their parents

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install linters (pinned) and the application's dependencies (mypy reads them)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install "ruff==0.16.10" "mypy==2.4.0" "bandit==1.9.4"

      - name: ruff (backend/ruff.toml)
        working-directory: backend
        run: ruff check app tests

      - name: mypy (backend/mypy.ini - gated packages only)
        working-directory: backend
        run: mypy

      - name: bandit (medium+ severity and confidence, application code)
        working-directory: backend
        run: bandit -q -r app -ll -ii

      - name: gitleaks secret scan (.gitleaks.toml)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"           # the binary the action downloads; pinned like everything else
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"    # the job has no write permission; the failing step is the signal

  backend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atp_user
          POSTGRES_PASSWORD: atp_dev_password
          POSTGRES_DB: advance_trading_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atp_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite (in-memory SQLite, no DB dependency)
        env:
          REDIS_URL: redis://localhost:6379/0
        # P0.7: each failed test becomes a check-run annotation (`::error`), so the failure is readable from the API
        # without the job log (which GitHub serves from a host the session tooling cannot reach).
        # The default shell is `bash -e`: a failing pipeline would stop the script before the annotations are written,
        # so the exit status is captured with `|| status=$?` instead of relying on $? after the pipe.
        run: |
          set -o pipefail
          status=0
          python -m pytest -q -rf 2>&1 | tee pytest-output.txt || status=$?
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | head -50 | sed 's/^/::error title=pytest::/' || true
          exit $status

      - name: Apply Alembic migrations against a real Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://atp_user:atp_dev_password@localhost:5432/advance_trading_platform
        run: alembic upgrade head

      - name: Confirm no schema drift between models and migrations
        env:
          DATABASE_URL: postgresql+asyncpg://atp_user:atp_dev_password@localhost:5432/advance_trading_platform
        run: alembic check

      - name: Backup rehearsal (pg_dump -> restore into scratch DB -> verify, Phase E3)
        env:
          DATABASE_URL: postgresql+asyncpg://atp_user:atp_dev_password@localhost:5432/advance_trading_platform
        run: python -m pytest tests/test_backup_scripts.py -q -rs

      - name: Audit Python dependencies for known vulnerabilities (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check + production build
        run: npm run build

      - name: Audit production dependencies for known vulnerabilities (npm audit)
        run: npm audit --omit=dev

      - name: Audit all dependencies including dev-only (report only, does not fail the build)
        if: always()
        run: npm audit || true

  container-scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build backend image
        run: docker build -t atp-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t atp-frontend:ci ./frontend

      - name: Scan backend image for OS/dependency vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atp-backend:ci
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan frontend image for OS/dependency vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atp-frontend:ci
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
