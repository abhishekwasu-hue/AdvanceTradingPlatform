name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atp_user
          POSTGRES_PASSWORD: atp_dev_password
          POSTGRES_DB: advance_trading_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atp_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite (in-memory SQLite, no DB dependency)
        env:
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -q

      - name: Apply Alembic migrations against a real Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://atp_user:atp_dev_password@localhost:5432/advance_trading_platform
        run: alembic upgrade head

      - name: Confirm no schema drift between models and migrations
        env:
          DATABASE_URL: postgresql+asyncpg://atp_user:atp_dev_password@localhost:5432/advance_trading_platform
        run: alembic check

      - name: Backup rehearsal (pg_dump -> restore into scratch DB -> verify, Phase E3)
        env:
          DATABASE_URL: postgresql+asyncpg://atp_user:atp_dev_password@localhost:5432/advance_trading_platform
        run: python -m pytest tests/test_backup_scripts.py -q -rs

      - name: Audit Python dependencies for known vulnerabilities (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check + production build
        run: npm run build

      - name: Audit production dependencies for known vulnerabilities (npm audit)
        run: npm audit --omit=dev

      - name: Audit all dependencies including dev-only (report only, does not fail the build)
        if: always()
        run: npm audit || true

  container-scan:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t atp-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t atp-frontend:ci ./frontend

      - name: Scan backend image for OS/dependency vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: atp-backend:ci
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan frontend image for OS/dependency vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: atp-frontend:ci
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
