name: Secret scan (full history)

# The repository is public (docs/PUBLIC_REPO_POLICY.md). This scans EVERY commit reachable from any branch or tag with
# gitleaks (.gitleaks.toml, .gitleaksignore), not only the commits of a push - ci.yml's `lint` job does that for each
# push. It runs on every push to main, once a week and from the Actions tab. Findings are redacted in the log. A
# finding is handled as the policy says: rotate the credential first; rewriting history is the owner's decision.
#
# The gitleaks release binary is pinned by version and by the sha256 from that release's official checksums file
# (gitleaks_<version>_checksums.txt); the download is refused when it does not match. No secrets are used. The action
# SHAs are the ones ci.yml pins (the tag each stands for is in the comment).
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "41 3 * * 1"   # Monday 09:11 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gitleaks-full-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"   # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0              # every commit of every branch and tag
          persist-credentials: false  # nothing here writes to the repository

      - name: Install gitleaks (pinned version, sha256 verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      - name: gitleaks over the full history (all refs, redacted)
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git --log-opts="--all" --config .gitleaks.toml \
            --gitleaks-ignore-path .gitleaksignore --redact --no-banner --verbose --exit-code 1 .
