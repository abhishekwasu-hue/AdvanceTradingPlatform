# P0.7: every container's stdout/stderr is kept by Docker's json-file driver; without a cap it grows until
# the disk is full (the PAPER PC and the droplet both learnt this the hard way elsewhere). 20 MB x 5 files
# per service, compressed - `docker compose logs --tail` is unaffected. Overlays inherit it.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  postgres:
    logging: *default-logging
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-advance_trading_platform}
    # Phase O5 / section 52: continuous WAL archiving into the `wal_archive` volume so
    # scripts/backup/pitr_restore.sh can recover to any instant (RPO minutes, not a day).
    command: ["postgres", "-c", "wal_level=replica", "-c", "archive_mode=on", "-c", "archive_timeout=300",
              "-c", "archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - wal_archive:/wal_archive
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atp_user} -d ${POSTGRES_DB:-advance_trading_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    logging: *default-logging
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    logging: *default-logging
    build:
      context: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-atp_user}:${POSTGRES_PASSWORD:-atp_dev_password}@postgres:5432/${POSTGRES_DB:-advance_trading_platform}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-secret-change-me}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      SECRETS_WRITE_FORMAT: ${SECRETS_WRITE_FORMAT:-fernet}
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ALGO_ID_REQUIRED_FOR_LIVE: ${ALGO_ID_REQUIRED_FOR_LIVE:-false}
      ORDER_MARKET_PROTECTION_PCT: ${ORDER_MARKET_PROTECTION_PCT:-}
      LIVE_STRICT_WING_FILL: ${LIVE_STRICT_WING_FILL:-false}
      LIVE_MARKET_PROTECTION: ${LIVE_MARKET_PROTECTION:-false}
      LIVE_UPSTOX_OPTION_STOP_LIMIT: ${LIVE_UPSTOX_OPTION_STOP_LIMIT:-false}
      LIVE_EXIT_IF_NO_STOP: ${LIVE_EXIT_IF_NO_STOP:-false}
      STOP_LIMIT_BAND_PCT: ${STOP_LIMIT_BAND_PCT:-}
      BACKTEST_HOLDOUT_START: ${BACKTEST_HOLDOUT_START:-}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-manual}
      PLATFORM_SMTP_HOST: ${PLATFORM_SMTP_HOST:-}
      PLATFORM_SMTP_PORT: ${PLATFORM_SMTP_PORT:-587}
      PLATFORM_SMTP_USERNAME: ${PLATFORM_SMTP_USERNAME:-}
      PLATFORM_SMTP_PASSWORD: ${PLATFORM_SMTP_PASSWORD:-}
      PLATFORM_SMTP_FROM: ${PLATFORM_SMTP_FROM:-}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      MIGRATION_FORCE: ${MIGRATION_FORCE:-}
      # Phase O1: schema changes run as the owning role; unset = same as DATABASE_URL (single-role dev DB)
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ops@example.com}
      # B8: phone notifications (FCM) for the Android app; all empty = off
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_JSON_BASE64: ${FCM_SERVICE_ACCOUNT_JSON_BASE64:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # GS-1: Google sign-in. Both empty = no Google button and the /api/auth/google/* routes answer 404.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # UX2 fix 5: the platform's Telegram bot ("Connect Telegram"). Empty = the Connect button says it is not set up yet.
      ATP_TELEGRAM_BOT_TOKEN: ${ATP_TELEGRAM_BOT_TOKEN:-}
      ATP_TELEGRAM_BOT_USERNAME: ${ATP_TELEGRAM_BOT_USERNAME:-}
      ATP_TELEGRAM_WEBHOOK_SECRET: ${ATP_TELEGRAM_WEBHOOK_SECRET:-}
      # A2: the operator's server alerts (deploy/atp.sh ops-check runs them in this container) and the error tracker.
      # All optional: the operator chat is linked from Admin > System > Alerts; e-mail goes to SUPER_ADMIN_EMAILS when
      # OPS_ALERT_EMAIL is empty; ERROR_TRACKER_DSN empty = no error tracker.
      OPS_ALERT_TELEGRAM_CHAT_ID: ${OPS_ALERT_TELEGRAM_CHAT_ID:-}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
      OPS_ALERT_AFTER_CHECKS: ${OPS_ALERT_AFTER_CHECKS:-2}
      OPS_ALERT_REPEAT_HOURS: ${OPS_ALERT_REPEAT_HOURS:-6}
      ERROR_TRACKER_DSN: ${ERROR_TRACKER_DSN:-}
      ERROR_TRACKER_ENVIRONMENT: ${ERROR_TRACKER_ENVIRONMENT:-}
      # AUD-G2.1: OpenTelemetry tracing - empty endpoint = off (nothing exported). Values only in .env, never in git.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      GLOBAL_CUES_ENABLED: ${GLOBAL_CUES_ENABLED:-true}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-8388608}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      # P0.2 / S1: proxies whose X-Forwarded-For uvicorn trusts (prod overlay: the Caddy container).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # LD-7: API processes (backend/scripts/serve_api.sh) and each process's DB pool (app/core/config.py). The database
      # sees API_WORKERS x (DB_POOL_SIZE + DB_MAX_OVERFLOW) from the API, plus the workers' own pools (5 + 10 each).
      API_WORKERS: ${API_WORKERS:-1}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      BCRYPT_NICE: ${BCRYPT_NICE:-5}
      JWT_PREVIOUS_SECRET_KEYS: ${JWT_PREVIOUS_SECRET_KEYS:-}
      JWT_ISSUER: ${JWT_ISSUER:-atp}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-atp-web}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-atp_refresh}
      JWT_ACCEPT_LEGACY: ${JWT_ACCEPT_LEGACY:-true}
      REFRESH_TOKEN_IN_BODY: ${REFRESH_TOKEN_IN_BODY:-true}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-}
      LOGIN_CAPTCHA_AFTER_FAILURES: ${LOGIN_CAPTCHA_AFTER_FAILURES:-0}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-}
      CAPTCHA_SECRET: ${CAPTCHA_SECRET:-}
      EGRESS_ALLOWED_HOSTS: ${EGRESS_ALLOWED_HOSTS:-}
      # The platform administrators (app/admin/bootstrap.py): promoted to SUPER_ADMIN at startup and when they register.
      # Without it nobody can open Admin -> Controls (the Phase 0 flags, invite codes) on a compose host.
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      # U1 / WL1: shown on the admin's system-watchlists view (the worker runs the sync itself).
      UNIVERSE_SYNC_ENABLED: ${UNIVERSE_SYNC_ENABLED:-false}
      UNIVERSE_SYNC_HOUR_IST: ${UNIVERSE_SYNC_HOUR_IST:-18}
      # DATA-H fix (25 Oct): the owner's history settings (HB0 / HB2, app/core/config.py) reach the containers; before,
      # .env had them but compose passed only its own list, so lake-backfill said "HISTORY_OWNER_TENANT_ID is not set".
      HISTORY_OWNER_TENANT_ID: ${HISTORY_OWNER_TENANT_ID:-}
      HISTORY_OWNER_TENANT_NAME: ${HISTORY_OWNER_TENANT_NAME:-}
      HISTORY_OWNER_USER_ID: ${HISTORY_OWNER_USER_ID:-}
      # M55 S1: the one account that may switch LIVE on (app/core/config.py LIVE_OWNER_USER_ID, default 1).
      LIVE_OWNER_USER_ID: ${LIVE_OWNER_USER_ID:-1}
      HISTORY_INTRADAY_SYMBOLS: ${HISTORY_INTRADAY_SYMBOLS:-}
      HISTORY_INTRADAY_INCLUDE_DEPLOYMENTS: ${HISTORY_INTRADAY_INCLUDE_DEPLOYMENTS:-true}
    # Analyze a chart: users' chart images, private to the backend and the worker (never served by Caddy, never in git;
    # retention and delete are the app's - docs/design/CHART_ANALYZE.md section 3).
    volumes:
      - private_data:/data/private
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped                 # M55 O1: the workers wait for it; it comes back on its own like them

  # The autonomous trading engine - same image as the API, different entrypoint. Runs (and
  # trades) independently of the API and of any browser; restart it, not the API, if it wedges.
  # Exactly one replica unless Redis is reachable (its lock is what stops two replicas trading).
  worker:
    logging: *default-logging
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.trading_worker"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-atp_user}:${POSTGRES_PASSWORD:-atp_dev_password}@postgres:5432/${POSTGRES_DB:-advance_trading_platform}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-secret-change-me}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      SECRETS_WRITE_FORMAT: ${SECRETS_WRITE_FORMAT:-fernet}
      REDIS_URL: redis://redis:6379/0
      WORKER_CYCLE_SECONDS: ${WORKER_CYCLE_SECONDS:-60}
      ALGO_ID_REQUIRED_FOR_LIVE: ${ALGO_ID_REQUIRED_FOR_LIVE:-false}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_LOGIN_EVENTS_DAYS: ${RETENTION_LOGIN_EVENTS_DAYS:-365}
      RETENTION_ALERT_DELIVERIES_DAYS: ${RETENTION_ALERT_DELIVERIES_DAYS:-90}
      RETENTION_NOTIFICATIONS_DAYS: ${RETENTION_NOTIFICATIONS_DAYS:-180}
      RETENTION_SESSIONS_DAYS: ${RETENTION_SESSIONS_DAYS:-30}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9102}
      INSTRUMENT_SYNC_EXCHANGES: ${INSTRUMENT_SYNC_EXCHANGES:-NSE}
      # U1 / WL1: the NSE reference-data sync (off until the owner has checked the files' terms, docs/DATA_SOURCES.md)
      # and its IST hour; the read-only system watchlists are rebuilt after it each day. UNIVERSE_FILE_URLS (JSON)
      # overrides a file's URL or adds one (e.g. "classification", the full NSE industry classification).
      UNIVERSE_SYNC_ENABLED: ${UNIVERSE_SYNC_ENABLED:-false}
      UNIVERSE_SYNC_HOUR_IST: ${UNIVERSE_SYNC_HOUR_IST:-18}
      UNIVERSE_FILE_URLS: ${UNIVERSE_FILE_URLS:-}
      # DATA-H fix (25 Oct): the owner's history settings (HB0 / HB2, app/core/config.py) reach the containers; before,
      # .env had them but compose passed only its own list, so lake-backfill said "HISTORY_OWNER_TENANT_ID is not set".
      HISTORY_OWNER_TENANT_ID: ${HISTORY_OWNER_TENANT_ID:-}
      HISTORY_OWNER_TENANT_NAME: ${HISTORY_OWNER_TENANT_NAME:-}
      HISTORY_OWNER_USER_ID: ${HISTORY_OWNER_USER_ID:-}
      # M55 S1: the one account that may switch LIVE on (app/core/config.py LIVE_OWNER_USER_ID, default 1).
      LIVE_OWNER_USER_ID: ${LIVE_OWNER_USER_ID:-1}
      HISTORY_INTRADAY_SYMBOLS: ${HISTORY_INTRADAY_SYMBOLS:-}
      HISTORY_INTRADAY_INCLUDE_DEPLOYMENTS: ${HISTORY_INTRADAY_INCLUDE_DEPLOYMENTS:-true}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ops@example.com}
      # B8: phone notifications (FCM) for the Android app; all empty = off
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_JSON_BASE64: ${FCM_SERVICE_ACCOUNT_JSON_BASE64:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      # UX2 fix 5: the worker sends the alerts, so it reads the platform bot's token too.
      ATP_TELEGRAM_BOT_TOKEN: ${ATP_TELEGRAM_BOT_TOKEN:-}
      ERROR_TRACKER_DSN: ${ERROR_TRACKER_DSN:-}            # A2: empty = no error tracker
      ERROR_TRACKER_ENVIRONMENT: ${ERROR_TRACKER_ENVIRONMENT:-}
      # AUD-G2.1: OpenTelemetry tracing - empty endpoint = off (nothing exported). Values only in .env, never in git.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      STREAMING_QUOTES_ENABLED: ${STREAMING_QUOTES_ENABLED:-false}
      TICK_MAX_AGE_SECONDS: ${TICK_MAX_AGE_SECONDS:-120}
      GLOBAL_CUES_ENABLED: ${GLOBAL_CUES_ENABLED:-true}
      ORDER_MARKET_PROTECTION_PCT: ${ORDER_MARKET_PROTECTION_PCT:-}
      LIVE_STRICT_WING_FILL: ${LIVE_STRICT_WING_FILL:-false}
      LIVE_MARKET_PROTECTION: ${LIVE_MARKET_PROTECTION:-false}
      LIVE_UPSTOX_OPTION_STOP_LIMIT: ${LIVE_UPSTOX_OPTION_STOP_LIMIT:-false}
      LIVE_EXIT_IF_NO_STOP: ${LIVE_EXIT_IF_NO_STOP:-false}
      STOP_LIMIT_BAND_PCT: ${STOP_LIMIT_BAND_PCT:-}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      EGRESS_ALLOWED_HOSTS: ${EGRESS_ALLOWED_HOSTS:-}
    volumes:
      - private_data:/data/private      # Analyze a chart: the daily retention job deletes expired images here
    # Prometheus scrapes the worker's own metrics here; not published to the host by default.
    expose:
      - "9102"
    # The image's HEALTHCHECK probes the API on :8000, which the worker does not serve; probe the
    # worker's own metrics server instead (127.0.0.1, not localhost: no IPv6 surprises).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${WORKER_METRICS_PORT:-9102}/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # M55 O1: the API applies the migrations at start (scripts/serve_api.sh), so the worker waits until it answers its
    # healthcheck - never a trading cycle on a schema the API has not finished migrating.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  # H-C3c: runs queued AI research studies one at a time, apart from trading and the API. Off unless started:
  #   docker compose --profile research up -d research-worker
  # Studies stay "queued" until it runs. It places no orders and saves no strategies.
  research-worker:
    logging: *default-logging
    profiles: ["research"]
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.research_worker"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-atp_user}:${POSTGRES_PASSWORD:-atp_dev_password}@postgres:5432/${POSTGRES_DB:-advance_trading_platform}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-secret-change-me}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      SECRETS_WRITE_FORMAT: ${SECRETS_WRITE_FORMAT:-fernet}
      REDIS_URL: redis://redis:6379/0
      BACKTEST_HOLDOUT_START: ${BACKTEST_HOLDOUT_START:-}
      EGRESS_ALLOWED_HOSTS: ${EGRESS_ALLOWED_HOSTS:-}
      RESEARCH_POLL_SECONDS: ${RESEARCH_POLL_SECONDS:-15}
    # no HTTP server: the image's API healthcheck does not apply
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy          # M55 O1: as the trading worker
    restart: unless-stopped

  frontend:
    logging: *default-logging
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

  # Phase E3: daily logical backups of the database into the `backups` volume (pg_dump custom
  # format, optional AES-256 encryption, SHA-256 sidecars, retention). Same Postgres major as the
  # database so pg_dump/pg_restore match. Rehearse a restore with:
  #   docker compose run --rm --entrypoint sh backup /scripts/verify_backup.sh latest
  backup:
    logging: *default-logging
    image: postgres:17-alpine
    entrypoint: ["sh", "/scripts/run_scheduled.sh"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atp_user}:${POSTGRES_PASSWORD:-atp_dev_password}@postgres:5432/${POSTGRES_DB:-advance_trading_platform}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-7}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
      WAL_ARCHIVE_DIR: /wal_archive
    volumes:
      - ./scripts/backup:/scripts:ro
      - backups:/backups
      - wal_archive:/wal_archive
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  backups:
  wal_archive:
  private_data:
